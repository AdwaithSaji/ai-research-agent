<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-labelledby="t d">
  <title id="t">Pipeline stages</title>
  <desc id="d">Five fixed stages. Each lists which steps call the language model and which are deterministic code: planning uses the model; searching is code; analysis ranks in code, calls the model per kept source and verifies quotes in code; verification filters in code and makes one batched model call; synthesis assigns citations in code, calls the model for narrative and strips invalid markers in code.</desc>
  <rect width="1240" height="400" rx="14" fill="#0e1214"/>
  <rect x="0.5" y="0.5" width="1239" height="399" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><text x="36" y="44" font-size="13" letter-spacing="3" fill="#34d399" font-weight="600">FIXED PIPELINE: RUNS ONCE PER QUESTION, NO AGENT LOOP</text></g>
  <rect x="36" y="70" width="214" height="250" rx="10" fill="#141a1d" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="54" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6f8187" font-weight="600">1</text>
  <text x="76" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1f5f4" font-weight="700" letter-spacing="1">PLAN</text>
  <rect x="54" y="122" width="178" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="58" cy="153" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="72" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">LLM: decompose the question</text>
  <circle cx="58" cy="203" r="3.5" fill="#4b5d63"/>
  <text x="72" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">2, 3 or 4 subquestions by depth</text>
  <circle cx="58" cy="253" r="3.5" fill="#4b5d63"/>
  <text x="72" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Each has its own queries</text>
  <path d="M253 189.0 l9 6 l-9 6" fill="none" stroke="#6f8187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="274" y="70" width="214" height="250" rx="10" fill="#141a1d" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="292" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6f8187" font-weight="600">2</text>
  <text x="314" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1f5f4" font-weight="700" letter-spacing="1">SEARCH</text>
  <rect x="292" y="122" width="178" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="296" cy="153" r="5" fill="#34d399"/>
  <text x="310" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">DuckDuckGo or Tavily search</text>
  <circle cx="296" cy="203" r="5" fill="#34d399"/>
  <text x="310" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Dedupe URLs, cap per domain</text>
  <circle cx="296" cy="253" r="5" fill="#34d399"/>
  <text x="310" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Fetch pages, extract main text</text>
  <path d="M491 189.0 l9 6 l-9 6" fill="none" stroke="#6f8187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="512" y="70" width="214" height="250" rx="10" fill="#141a1d" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="530" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6f8187" font-weight="600">3</text>
  <text x="552" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1f5f4" font-weight="700" letter-spacing="1">ANALYZE</text>
  <rect x="530" y="122" width="178" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="534" cy="153" r="5" fill="#34d399"/>
  <text x="548" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Rank sources by relevance</text>
  <circle cx="534" cy="203" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="548" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">LLM: up to 3 claims + quote</text>
  <circle cx="534" cy="253" r="5" fill="#34d399"/>
  <text x="548" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Quotes verified against page</text>
  <path d="M729 189.0 l9 6 l-9 6" fill="none" stroke="#6f8187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="750" y="70" width="214" height="250" rx="10" fill="#141a1d" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="768" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6f8187" font-weight="600">4</text>
  <text x="790" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1f5f4" font-weight="700" letter-spacing="1">VERIFY</text>
  <rect x="768" y="122" width="178" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="772" cy="153" r="5" fill="#34d399"/>
  <text x="786" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Drop low-quality sources</text>
  <circle cx="772" cy="203" r="5" fill="#34d399"/>
  <text x="786" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Drop failed-quote evidence</text>
  <circle cx="772" cy="253" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="786" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">LLM: batched conflict check</text>
  <path d="M967 189.0 l9 6 l-9 6" fill="none" stroke="#6f8187" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="988" y="70" width="214" height="250" rx="10" fill="#141a1d" stroke="#ffffff" stroke-opacity="0.09"/>
  <text x="1006" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6f8187" font-weight="600">5</text>
  <text x="1028" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1f5f4" font-weight="700" letter-spacing="1">SYNTHESIZE</text>
  <rect x="1006" y="122" width="178" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <circle cx="1010" cy="153" r="5" fill="#34d399"/>
  <text x="1024" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Citations assigned in code</text>
  <circle cx="1010" cy="203" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="1024" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">LLM: narrative from evidence</text>
  <circle cx="1010" cy="253" r="5" fill="#34d399"/>
  <text x="1024" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#c3cfd2">Invalid [n] markers stripped</text>
  <circle cx="44" cy="361" r="5" fill="#34d399"/><text x="58" y="366" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9fb0b5">Deterministic code</text>
  <circle cx="220" cy="361" r="5" fill="none" stroke="#fbbf24" stroke-width="2"/><text x="234" y="366" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9fb0b5">Language-model call</text>
  <text x="1204" y="366" text-anchor="end" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9fb0b5">If no evidence survives verification, the report says so instead of asking the model to fill the gap.</text>
</svg>
